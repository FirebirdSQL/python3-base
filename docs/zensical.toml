[project]
site_name = "The Firebird Base library for Python"
site_author = "Pavel Císař"
copyright = "2020-2026, The Firebird Project"
site_url = "https://firebird-base.readthedocs.io/"


nav = [
    { "Home" = "index.md" },
    { "Introduction" = "introduction.md" },
    { "Modules" = [
        { "types" = "types.md" },
        { "collections" = "collections.md" },
        { "strconv" = "strconv.md" },
        { "config" = "config.md" },
        { "buffer" = "buffer.md" },
        { "hooks" = "hooks.md" },
        { "logging" = "logging.md" },
        { "trace" = "trace.md" },
        { "protobuf" = "protobuf.md" },
        { "signal" = "signal.md" }
    ]},
    { "Changelog" = "changelog.md" },
    { "License" = "license.md" }
]

[project.theme]
features = [
    "navigation.instant",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.expand",
    "navigation.path",
    "navigation.top",
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["../src", "src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_root_heading = true
show_source = true
backlinks = "tree"
find_stubs_package = true
#show_signature_annotations = true

[project.plugins.llmstxt]
enabled = true
markdown_description = "For version 2.0.3"
sections = {
"Home" = ["index.md"],
"Introduction" = [
    "introduction.md",
],
"Modules" = [
    "buffer.md",
    "collections.md",
    "config.md",
    "hooks.md",
    "logging.md",
    "protobuf.md",
    "signal.md",
    "strconv.md",
    "trace.md",
    "types.md",
],
}
